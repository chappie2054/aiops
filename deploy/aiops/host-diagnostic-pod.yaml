apiVersion: v1
kind: Pod
metadata:
  name: aiops-host-diagnostic
  namespace: aiops-test
  labels:
    app: aiops-host-diagnostic
spec:
  # 临时只读诊断用：固定到要检查的节点；不填则交给调度器。
  # nodeName: k8s-master-shizai
  restartPolicy: Never
  automountServiceAccountToken: false
  hostPID: true
  containers:
    - name: toolbox
      image: aiops/workbench:v15
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
          mountPropagation: HostToContainer
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 256Mi}
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
