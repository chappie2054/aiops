<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录集群运维工作台</title>
<style>body{font:16px/1.5 system-ui,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;background:#10141d;color:#ecf1fa}main{width:min(400px,calc(100vw - 48px));background:#1b2331;border:1px solid #344158;border-radius:18px;padding:32px;box-shadow:0 20px 60px #0005}h1{font-size:1.7rem;margin:0 0 8px}p{color:#aebdd1;margin:0 0 26px}label{display:block;font-size:.92rem;margin:18px 0 7px}input{box-sizing:border-box;width:100%;border:1px solid #52627a;border-radius:9px;padding:12px;background:#10141d;color:#fff;font:inherit}input:focus{outline:2px solid #5886f4}button{width:100%;border:0;border-radius:9px;padding:12px;margin-top:26px;background:#4079f5;color:#fff;font:inherit;font-weight:600;cursor:pointer}.error{color:#ffaaa9;margin:18px 0 0}</style>
<main><h1>集群运维工作台</h1><p>使用独立账号登录，进入 DeepSeek Harness 管理集群。</p><form method="post" action="/login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form>{{ERROR}}</main></html>
