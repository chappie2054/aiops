<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 AIOps 运维平台</title><link rel="icon" type="image/svg+xml" href="{{BASE_PATH}}/aiops/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:#f4f6f4;color:#1c2922;font:15px/1.5 system-ui,sans-serif}
header{padding:25px max(5vw,24px);background:#fff;border-bottom:1px solid #dde4de;display:flex;align-items:center;gap:11px;font-weight:650;font-size:17px}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#1f5f4b;color:#fff;font-weight:700}
main{align-self:center;justify-self:center;width:min(420px,calc(100vw - 40px));padding:34px;border:1px solid #d9e1da;border-radius:13px;background:#fff;box-shadow:0 12px 34px #1b35231a}h1{margin:0 0 6px;font-size:23px;letter-spacing:-.02em}p{margin:0 0 25px;color:#66746a}label{display:block;margin:17px 0 6px;font-size:14px;font-weight:600}
input{width:100%;padding:11px 12px;border:1px solid #bfcac1;border-radius:7px;background:#fff;color:#1c2922;font:inherit}input:focus{outline:2px solid #1f5f4b;outline-offset:1px}button{width:100%;margin-top:26px;padding:11px 14px;border:0;border-radius:7px;background:#1f5f4b;color:#fff;font:600 15px/1.4 system-ui,sans-serif;cursor:pointer}button:hover{background:#184c3b}.error{margin:15px 0 0;color:#a52b2b}footer{padding:20px;text-align:center;color:#819087;font-size:12px}
</style>
</head>
<body><header><span class="mark" aria-hidden="true">A</span>AIOps 运维平台</header>
<main><h1>登录工作台</h1><p>使用运维平台账号访问集群管理功能。</p>
<form method="post" action="{{BASE_PATH}}/login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form>{{ERROR}}</main>
<footer>集群运维工作台</footer></body></html>
