<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">自动根因分析报告示意</title>
  <desc id="desc">示例报告展示异常对象、已确认事实、疑似根因、缺失证据、恢复建议与验证步骤。图中服务和数据均为虚构。</desc>
  <rect width="1200" height="520" rx="22" fill="#111827"/>
  <g font-family="Arial,Microsoft YaHei,sans-serif">
    <text x="42" y="48" fill="#f8fafc" font-size="23" font-weight="700">自动根因分析报告</text>
    <rect x="1001" y="24" width="156" height="31" rx="15" fill="#253448"/>
    <text x="1020" y="45" fill="#a6b9ce" font-size="14">示意数据 · 非真实故障</text>
    <rect x="42" y="79" width="1115" height="74" rx="14" fill="#1d2939" stroke="#334155"/>
    <circle cx="68" cy="116" r="6" fill="#f0aa62"/>
    <text x="87" y="113" fill="#f8fafc" font-size="19" font-weight="700">订单服务 · Deployment 不可用</text>
    <text x="87" y="139" fill="#a8b7c8" font-size="14">业务命名空间 / 期望 2 副本 / 可用 1 副本</text>
    <rect x="42" y="175" width="540" height="134" rx="14" fill="#1d2939" stroke="#334155"/>
    <text x="63" y="209" fill="#8fc9e3" font-size="17" font-weight="700">已确认事实</text>
    <text x="63" y="242" fill="#dce5ee" font-size="15">• Pod 连续重启，最近状态为 CrashLoopBackOff</text>
    <text x="63" y="270" fill="#dce5ee" font-size="15">• 事件与容器退出时间相互吻合</text>
    <rect x="600" y="175" width="557" height="134" rx="14" fill="#1d2939" stroke="#334155"/>
    <text x="621" y="209" fill="#8fc9e3" font-size="17" font-weight="700">疑似根因</text>
    <text x="621" y="242" fill="#dce5ee" font-size="15">启动配置缺少必填项，应用初始化后退出</text>
    <text x="621" y="270" fill="#9fb0c2" font-size="15">置信度：高 · 根据事件与日志推断</text>
    <rect x="42" y="327" width="540" height="151" rx="14" fill="#1d2939" stroke="#334155"/>
    <text x="63" y="361" fill="#8fc9e3" font-size="17" font-weight="700">缺失证据</text>
    <text x="63" y="394" fill="#dce5ee" font-size="15">• 尚未核对本次发布的配置变更记录</text>
    <text x="63" y="422" fill="#dce5ee" font-size="15">• 需确认依赖服务的实际连接状态</text>
    <rect x="600" y="327" width="557" height="151" rx="14" fill="#17362f" stroke="#397b65"/>
    <text x="621" y="361" fill="#a5e8c1" font-size="17" font-weight="700">恢复建议与验证</text>
    <text x="621" y="394" fill="#e0eee7" font-size="15">核对启动配置并按变更流程修复</text>
    <text x="621" y="422" fill="#e0eee7" font-size="15">观察 Pod Ready、可用副本和错误日志</text>
    <text x="42" y="505" fill="#76889d" font-size="13">自动任务只读分析；任何修复操作由运维人员明确发起。</text>
  </g>
</svg>
